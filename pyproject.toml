[project]
name = "fakenews-blockchain"
version = "0.1.0"
description = "Real-Time Multimodal Fake News Detection & Fact Verification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.33",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",
    "trafilatura>=1.9.0",
    "pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=2.0.0",
    "paddleocr>=3.0.0",
    "paddlepaddle>=3.0.0",
    "paddlex>=3.7.0",
    "web3>=8.0.0",
    "reportlab>=5.0.0",
    "qrcode>=8.0",
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
